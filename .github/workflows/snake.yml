name: snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#C77C00&color_dots=#E3EAF3,#BFD3EA,#8DB3DC,#4F8BC9,#1D6FB8
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFB547&color_dots=#1C2D44,#244A73,#2F6BA3,#4F93D1,#7CC6FE

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
